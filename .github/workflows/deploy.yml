name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  verify-hardening:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install container runtimes
        run: |
          sudo apt-get update
          sudo apt-get install -y podman podman-compose

      - name: Verify container hardening
        run: bash scripts/verify-hardening.sh

  bump-and-deploy:
    needs: verify-hardening
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine bump level from beads
        id: bump
        env:
          PYTHON_SCRIPT: |
            import sys, json
            from datetime import datetime
            TAG_DATE_STR = sys.argv[1] if len(sys.argv) > 1 else ""
            TAG_DATE = None
            if TAG_DATE_STR:
                try:
                    TAG_DATE = datetime.fromisoformat(TAG_DATE_STR.split('+')[0].strip())
                except:
                    pass
            issues = []
            for line in sys.stdin:
                line = line.strip()
                if not line:
                    continue
                try:
                    issues.append(json.loads(line))
                except:
                    pass
            # Only count issues closed after the tag date
            bumps = []
            for d in issues:
                if d.get('status') != 'closed':
                    continue
                if TAG_DATE:
                    closed = d.get('closed_at', '')
                    if closed:
                        try:
                            closed_dt = datetime.fromisoformat(closed.replace('Z', '+00:00').split('+')[0].strip())
                            if closed_dt <= TAG_DATE:
                                continue
                        except:
                            continue
                for label in d.get('labels', []):
                    if label.startswith('bump:') and label.split(':', 1)[1] in ('patch', 'minor', 'major'):
                        bumps.append(label.split(':', 1)[1])
            if not bumps:
                print('none')
            elif 'major' in bumps:
                print('major')
            elif 'minor' in bumps:
                print('minor')
            else:
                print('patch')
        run: |
          LAST_TAG=$(git tag -l 'v*' --sort=-v:refname | head -1)

          if [ -z "$LAST_TAG" ]; then
            echo "No version tags found"
            echo "level=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          COMMITS=$(git log "${LAST_TAG}..HEAD" --pretty=format:"%H" 2>/dev/null)
          if [ -z "$COMMITS" ]; then
            echo "No commits since last tag"
            echo "level=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Last tag: $LAST_TAG"

          # Get tag date for filtering
          TAG_DATE=$(git log -1 --format="%ci" "$LAST_TAG" 2>/dev/null)
          echo "Tag date: $TAG_DATE"

          # Read bump levels from beads labels
          BEADS_BUMP="none"
          if [ -f .beads/issues.jsonl ]; then
            BEADS_BUMP=$(python3 -c "${PYTHON_SCRIPT}" "$TAG_DATE" < .beads/issues.jsonl)
          fi
          echo "Beads bump: ${BEADS_BUMP}"

          # Also check commit messages for bump labels (fallback)
          COMMIT_BUMP="none"
          for commit in $COMMITS; do
            MSG=$(git log -1 --format="%s" "$commit" 2>/dev/null)
            if echo "$MSG" | grep -qE "bump:major"; then
              COMMIT_BUMP="major"
            elif echo "$MSG" | grep -qE "bump:minor" && [ "$COMMIT_BUMP" != "major" ]; then
              COMMIT_BUMP="minor"
            elif echo "$MSG" | grep -qE "bump:patch" && [ "$COMMIT_BUMP" = "none" ]; then
              COMMIT_BUMP="patch"
            fi
          done
          echo "Commit bump: ${COMMIT_BUMP}"

          # Pick highest: beads > commit
          MAX_BUMP="none"
          for b in "$BEADS_BUMP" "$COMMIT_BUMP"; do
            case "$MAX_BUMP" in
              none)   MAX_BUMP="$b" ;;
              patch)  if [ "$b" = "minor" ] || [ "$b" = "major" ]; then MAX_BUMP="$b"; fi ;;
              minor)  if [ "$b" = "major" ]; then MAX_BUMP="$b"; fi ;;
            esac
          done

          echo "level=${MAX_BUMP}" >> "$GITHUB_OUTPUT"
          echo "Final bump level: ${MAX_BUMP}"

      - name: Bump version
        id: version-bump
        if: steps.bump.outputs.level != 'none' && steps.bump.outputs.level != ''
        run: |
          LEVEL="${{ steps.bump.outputs.level }}"
          CURRENT=$(grep '^version = ' pyproject.toml | sed 's/.*"\(.*\)".*/\1/')
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"

          case "$LEVEL" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac

          NEW="${MAJOR}.${MINOR}.${PATCH}"
          echo "Bumping ${CURRENT} -> ${NEW} (${LEVEL})"

          if ! sed -i "s/^version = \"${CURRENT}\"/version = \"${NEW}\"/" pyproject.toml; then
            echo "::error::Failed to update version in pyproject.toml"
            exit 1
          fi

          # Verify the version was actually updated
          VERIFY=$(grep '^version = ' pyproject.toml | sed 's/.*"\(.*\)".*/\1/')
          if [ "$VERIFY" != "$NEW" ]; then
            echo "::error::Version mismatch after sed: expected ${NEW}, got ${VERIFY}"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml
          git commit -m "Bump version to ${NEW} [skip ci]"
          git tag "v${NEW}"
          git push origin main --tags

          echo "version=${NEW}" >> "$GITHUB_OUTPUT"

      - name: Trigger deploy via ntfy
        if: steps.bump.outputs.level != 'none' && steps.bump.outputs.level != ''
        run: |
          VERSION="${{ steps.version-bump.outputs.version || 'unknown' }}"
          SHORT_SHA="${GITHUB_SHA:0:7}"
          LEVEL="${{ steps.bump.outputs.level }}"

          curl -sf -X POST "https://ntfy.kuri.casa/${{ secrets.NTFY_DEPLOY_TOPIC }}" \
            -u "${{ secrets.NTFY_DEPLOY_USER }}:${{ secrets.NTFY_DEPLOY_PASS }}" \
            -H "Title: [mcproxy] v${VERSION} - deploy" \
            -H "Tags: rocket,mcproxy" \
            -H "Priority: high" \
            -d "deploy v${VERSION} ${SHORT_SHA} ${LEVEL}"

      - name: Notify
        if: steps.bump.outputs.level != 'none' && steps.bump.outputs.level != ''
        run: |
          VERSION="${{ steps.version-bump.outputs.version || 'unknown' }}"
          LEVEL="${{ steps.bump.outputs.level }}"
          SHORT_SHA="${GITHUB_SHA:0:7}"

          curl -sf -X POST "https://ntfy.kuri.casa/org" \
            -H "Authorization: Bearer ${{ secrets.NTFY_TOKEN }}" \
            -H "Title: [mcproxy] v${VERSION} deployed (${LEVEL})" \
            -H "Tags: rocket,mcproxy" \
            -H "Click: ${{ github.server_url }}/${{ github.repository }}/releases/tag/v${VERSION}}" \
            -d "v${VERSION} deployed to server2" || true
