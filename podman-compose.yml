version: "3.8"

services:
  mcproxy:
    build:
      context: .
      dockerfile: Dockerfile
    image: localhost/mcproxy:latest
    container_name: mcproxy
    networks:
      - default
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "12010:12010"
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - ./config:/app/config:Z
      - ./.env:/app/.env:ro
    environment_file:
      - .env
    working_dir: /app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:12010/sse', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    mem_limit: 512m
    read_only: false
